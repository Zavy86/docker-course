volumes:
  caddy-data:
  caddy-config:

services:
  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  web:
    image: nginx
  info:
    image: busybox
    command:
      - sh
      - -ec
      - |
        mkdir -p /www
        echo "Information service" > /www/index.html
        exec httpd -f -p 8080 -h /www
